<head>
  <meta charset="UTF-8" />

  <title>大型建築 — 林子茵 Portfolio</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .back-link { margin-bottom: 36px; }
    .back-link a {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-decoration: none;
      transition: color 0.15s;
    }
    .back-link a:hover { color: var(--primary); }

    .build-row {
      display: flex;
      gap: 40px;
      align-items: flex-start;
      margin-bottom: 72px;
    }
    .build-row:nth-child(even) { flex-direction: row-reverse; }
    .build-viewer { flex: 0 0 56%; }
    .build-info { flex: 1; padding-top: 4px; }
    .build-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .build-info h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 14px;
    }
    .build-info p { color: var(--text-muted); line-height: 1.85; font-size: 1rem; }

    @media (max-width: 720px) {
      .build-row,
      .build-row:nth-child(even) { flex-direction: column; }
      .build-viewer { flex: none; width: 100%; }
    }

    .viewer-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 220px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      background: #111;
    }
    .viewer-wrap canvas { display: block; width: 100% !important; height: 100% !important; }
    .viewer-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #ccc;
      font-size: 0.88rem;
      background: #111;
      z-index: 10;
      transition: opacity 0.4s;
    }
    .viewer-loading.hidden { opacity: 0; pointer-events: none; }
    .spin {
      width: 34px; height: 34px;
      border: 3px solid rgba(255,255,255,0.12);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .viewer-hint {
      position: absolute;
      bottom: 10px; right: 12px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.35);
      pointer-events: none;
      user-select: none;
      letter-spacing: 0.02em;
    }

    .empty-state {
      padding: 60px 0 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
      opacity: 0.5;
    }

    .tech-section {
      margin-top: 16px;
      padding-top: 48px;
      border-top: 1px solid var(--border);
    }
    .tech-section h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      border-left: 3px solid var(--primary);
      padding-left: 12px;
      margin-bottom: 16px;
    }
    .tech-list { display: flex; flex-wrap: wrap; gap: 10px; }
    .section-hint {
      font-size: 0.78rem; font-weight: 400;
      color: var(--text-muted); opacity: 0.65;
      margin-left: 10px; vertical-align: middle;
    }
    .tooltip-chip { position: relative; cursor: default; }
    .tooltip-chip::after {
      content: attr(data-tip);
      position: absolute;
      top: calc(100% + 10px); left: 50%;
      transform: translateX(-50%);
      background: var(--surface); color: var(--text-muted);
      font-size: 0.82rem; padding: 5px 14px;
      border-radius: 100px; border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      white-space: nowrap; opacity: 0;
      pointer-events: none; transition: opacity 0.2s;
    }
    .tooltip-chip::before {
      content: '';
      position: absolute;
      top: calc(100% + 3px); left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-bottom-color: var(--border);
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .tooltip-chip:hover::after,
    .tooltip-chip:hover::before { opacity: 1; }
  </style>
</head>
